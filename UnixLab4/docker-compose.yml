services:
  kafka:
    image: confluentinc/cp-kafka:7.3.2
    hostname: kafka 
    container_name: kafka 
    ports: ["9092:9092"]
    environment:
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 25
    depends_on:
      - zookeeper

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  producer:
    build: ./producer
    depends_on:
      - kafka
    restart: on-failure

  consumer:
    build: ./consumer
    depends_on:
      - kafka
    scale: 3 
    restart: on-failure
